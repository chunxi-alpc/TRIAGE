name: ASTER full-scale utility tests

on:
  pull_request:
    paths:
      - "experiments/aster_fullscale_20261029/**"
      - ".github/workflows/aster-fullscale-tests.yml"
  push:
    branches:
      - "codex/aster-fullscale-plan-20261029"
    paths:
      - "experiments/aster_fullscale_20261029/**"
      - ".github/workflows/aster-fullscale-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run ASTER utility tests
        run: python -m unittest discover -s experiments/aster_fullscale_20261029/tests -v
      - name: Check CLI help
        run: |
          python experiments/aster_fullscale_20261029/scripts/prepare_group_splits.py --help
          python experiments/aster_fullscale_20261029/scripts/paired_cluster_stats.py --help

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="635" viewBox="0 0 1040 635" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">图2：历史先导实验的干扰抑制与证据改动权衡曲线</title>
  <desc id="chart-desc">横轴是C/F证据配对的修正RMS，越小越好；纵轴是A/P干扰配对的方差降低率，越大越好。七个历史预算点连成一条右上升的曲线。预算从0.05放宽到无约束时，干扰抑制率从3.07%升到30.61%，而证据修正RMS从0.1266升到3.3240 logit。该图未标记最优预算。</desc>
  <style>
    text { font-family: "Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei","PingFang SC",sans-serif; fill: #24394b; }
    .heading { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 16px; fill: #627385; }
    .tick { font-size: 14px; fill: #647588; }
    .axis { font-size: 18px; font-weight: 600; }
    .budget { font-size: 15px; font-weight: 650; fill: #12677c; stroke: white; stroke-width: 5px; paint-order: stroke; stroke-linejoin: round; }
    .footnote { font-size: 15px; fill: #5b6a7a; }
  </style>
  <rect width="1040" height="635" fill="#ffffff"/>
  <text x="57" y="55" class="heading">图2　干扰抑制与证据改动的权衡</text>
  <text x="57" y="86" class="subtitle">历史先导实验 · 16维配置 · 同一受控留出集合</text>
  <text x="132" y="122" class="subtitle">点旁数字为历史归一化预算，连线仅用于呈现实测趋势</text>
  <rect x="132" y="142" width="788" height="352" fill="#fbfcfe" stroke="#d4dee6" stroke-width="1.2"/>
  <g><line x1="132.00" y1="142" x2="132.00" y2="494" stroke="#e4ebf0" stroke-width="1"/><text x="132.00" y="520" text-anchor="middle" class="tick">0.0</text></g>
<g><line x1="241.44" y1="142" x2="241.44" y2="494" stroke="#e4ebf0" stroke-width="1"/><text x="241.44" y="520" text-anchor="middle" class="tick">0.5</text></g>
<g><line x1="350.89" y1="142" x2="350.89" y2="494" stroke="#e4ebf0" stroke-width="1"/><text x="350.89" y="520" text-anchor="middle" class="tick">1.0</text></g>
<g><line x1="460.33" y1="142" x2="460.33" y2="494" stroke="#e4ebf0" stroke-width="1"/><text x="460.33" y="520" text-anchor="middle" class="tick">1.5</text></g>
<g><line x1="569.78" y1="142" x2="569.78" y2="494" stroke="#e4ebf0" stroke-width="1"/><text x="569.78" y="520" text-anchor="middle" class="tick">2.0</text></g>
<g><line x1="679.22" y1="142" x2="679.22" y2="494" stroke="#e4ebf0" stroke-width="1"/><text x="679.22" y="520" text-anchor="middle" class="tick">2.5</text></g>
<g><line x1="788.67" y1="142" x2="788.67" y2="494" stroke="#e4ebf0" stroke-width="1"/><text x="788.67" y="520" text-anchor="middle" class="tick">3.0</text></g>
<g><line x1="898.11" y1="142" x2="898.11" y2="494" stroke="#e4ebf0" stroke-width="1"/><text x="898.11" y="520" text-anchor="middle" class="tick">3.5</text></g>
  <g><line x1="132" y1="494.00" x2="920" y2="494.00" stroke="#e4ebf0" stroke-width="1"/><text x="114" y="499.00" text-anchor="end" class="tick">0</text></g>
<g><line x1="132" y1="443.71" x2="920" y2="443.71" stroke="#e4ebf0" stroke-width="1"/><text x="114" y="448.71" text-anchor="end" class="tick">5</text></g>
<g><line x1="132" y1="393.43" x2="920" y2="393.43" stroke="#e4ebf0" stroke-width="1"/><text x="114" y="398.43" text-anchor="end" class="tick">10</text></g>
<g><line x1="132" y1="343.14" x2="920" y2="343.14" stroke="#e4ebf0" stroke-width="1"/><text x="114" y="348.14" text-anchor="end" class="tick">15</text></g>
<g><line x1="132" y1="292.86" x2="920" y2="292.86" stroke="#e4ebf0" stroke-width="1"/><text x="114" y="297.86" text-anchor="end" class="tick">20</text></g>
<g><line x1="132" y1="242.57" x2="920" y2="242.57" stroke="#e4ebf0" stroke-width="1"/><text x="114" y="247.57" text-anchor="end" class="tick">25</text></g>
<g><line x1="132" y1="192.29" x2="920" y2="192.29" stroke="#e4ebf0" stroke-width="1"/><text x="114" y="197.29" text-anchor="end" class="tick">30</text></g>
<g><line x1="132" y1="142.00" x2="920" y2="142.00" stroke="#e4ebf0" stroke-width="1"/><text x="114" y="147.00" text-anchor="end" class="tick">35</text></g>
  <line x1="132" y1="494" x2="920" y2="494" stroke="#6d8193" stroke-width="1.4"/>
  <line x1="132" y1="142" x2="132" y2="494" stroke="#6d8193" stroke-width="1.4"/>
  <polyline points="159.71,463.12 187.58,452.77 254.73,437.28 349.42,399.66 490.85,319.41 703.17,225.37 859.59,186.15" fill="none" stroke="#12788F" stroke-width="3.8" stroke-linejoin="round" stroke-linecap="round"/>
  <g class="observation">
  <circle cx="159.71" cy="463.12" r="7.3" fill="#12788F" stroke="#ffffff" stroke-width="2.8">
    <title>预算 0.05；干扰方差降低率 3.07%；证据修正 RMS 0.1266 logit；证据响应保留率 99.82%</title>
  </circle>
  <text x="147.71" y="433.12" text-anchor="middle" class="budget">0.05</text>
</g>
<g class="observation">
  <circle cx="187.58" cy="452.77" r="7.3" fill="#12788F" stroke="#ffffff" stroke-width="2.8">
    <title>预算 0.10；干扰方差降低率 4.10%；证据修正 RMS 0.2539 logit；证据响应保留率 99.60%</title>
  </circle>
  <text x="195.58" y="479.77" text-anchor="start" class="budget">0.10</text>
</g>
<g class="observation">
  <circle cx="254.73" cy="437.28" r="7.3" fill="#12788F" stroke="#ffffff" stroke-width="2.8">
    <title>预算 0.25；干扰方差降低率 5.64%；证据修正 RMS 0.5607 logit；证据响应保留率 99.14%</title>
  </circle>
  <text x="267.73" y="425.28" text-anchor="start" class="budget">0.25</text>
</g>
<g class="observation">
  <circle cx="349.42" cy="399.66" r="7.3" fill="#12788F" stroke="#ffffff" stroke-width="2.8">
    <title>预算 0.50；干扰方差降低率 9.38%；证据修正 RMS 0.9933 logit；证据响应保留率 98.22%</title>
  </circle>
  <text x="362.42" y="383.66" text-anchor="start" class="budget">0.50</text>
</g>
<g class="observation">
  <circle cx="490.85" cy="319.41" r="7.3" fill="#12788F" stroke="#ffffff" stroke-width="2.8">
    <title>预算 1.00；干扰方差降低率 17.36%；证据修正 RMS 1.6394 logit；证据响应保留率 96.35%</title>
  </circle>
  <text x="504.85" y="301.41" text-anchor="start" class="budget">1.00</text>
</g>
<g class="observation">
  <circle cx="703.17" cy="225.37" r="7.3" fill="#12788F" stroke="#ffffff" stroke-width="2.8">
    <title>预算 2.00；干扰方差降低率 26.71%；证据修正 RMS 2.6094 logit；证据响应保留率 93.63%</title>
  </circle>
  <text x="716.17" y="210.37" text-anchor="start" class="budget">2.00</text>
</g>
<g class="observation">
  <circle cx="859.59" cy="186.15" r="7.3" fill="#12788F" stroke="#ffffff" stroke-width="2.8">
    <title>预算 无约束；干扰方差降低率 30.61%；证据修正 RMS 3.3240 logit；证据响应保留率 91.67%</title>
  </circle>
  <text x="859.59" y="168.15" text-anchor="middle" class="budget">无约束</text>
</g>
  <text x="526" y="565" text-anchor="middle" class="axis">C/F 证据修正 RMS（logit，越低越好）</text>
  <text transform="translate(44 318) rotate(-90)" text-anchor="middle" class="axis">A/P 干扰方差降低率（%，越高越好）</text>
  <line x1="56" y1="589" x2="984" y2="589" stroke="#e6edf2" stroke-width="1"/>
  <text x="57" y="615" class="footnote">注：原预算以拟合 A/P 原始 RMS 归一化；仅显示7个实测配置，不代表连续最优解。</text>
</svg>
